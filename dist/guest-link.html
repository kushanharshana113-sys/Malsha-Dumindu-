<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a guest invitation link</title><style>body{margin:0;background:#fff5f6;color:#74394f;font:17px Georgia,serif;display:grid;place-items:center;min-height:100vh}main{max-width:520px;padding:36px}h1{font-weight:400;font-size:32px}label{display:block;margin:24px 0 8px}input,button{box-sizing:border-box;font:16px Arial;padding:15px;border:1px solid #c77d98;border-radius:12px}input{width:100%;background:#fff}button{background:#984d6a;color:white;cursor:pointer;margin:16px 6px 0 0}a{color:#984d6a}#result{overflow-wrap:anywhere;line-height:1.6}small{line-height:1.6}</style><main><p>MALSHA & DUMINDU · 21.01.2027</p><h1>A personal invitation for every guest</h1><label for="guest">Guest name / ආරාධිතයාගේ නම</label><input id="guest" placeholder="Amaya & Family" maxlength="160"><button id="create">Create link</button><div id="result" aria-live="polite"></div><button id="copy" hidden>Copy link</button><p><small>The name appears on the opening screen and in the RSVP form. The invitation must be publicly accessible before sending links to guests.</small></p></main><script>let link='';document.querySelector('#create').onclick=()=>{const n=document.querySelector('#guest').value.trim();if(!n)return;const u=new URL('./',location.href);u.searchParams.set('guest',n);link=u.href;const a=document.createElement('a');a.href=link;a.textContent=link;a.target='_blank';document.querySelector('#result').replaceChildren(a);document.querySelector('#copy').hidden=false;};document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(link);document.querySelector('#copy').textContent='Copied';}catch{document.querySelector('#copy').textContent='Select and copy the link above';}};</script></html>
